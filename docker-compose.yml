services:
  postgres:
    image: postgres:16-alpine
    container_name: pgic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgic}
      POSTGRES_DB: ${POSTGRES_DB:-identity_service}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pgic-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pgic-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pgic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pgic}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: pgic-nginx
    environment:
      NGINX_ENVSUBST_FILTER: "^(IDENTITY_SERVICE_PORT|REQUEST_SERVICE_PORT|INCIDENT_SERVICE_PORT|PROBLEM_CHANGE_SERVICE_PORT|SLA_SERVICE_PORT|ESCALATION_SERVICE_PORT|NOTIFICATION_SERVICE_PORT|AUDIT_SERVICE_PORT|REPORTING_SERVICE_PORT|INTEGRATION_SERVICE_PORT|API_DOCS_PORT)$"
      IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-3001}
      REQUEST_SERVICE_PORT: ${REQUEST_SERVICE_PORT:-3002}
      INCIDENT_SERVICE_PORT: ${INCIDENT_SERVICE_PORT:-3004}
      PROBLEM_CHANGE_SERVICE_PORT: ${PROBLEM_CHANGE_SERVICE_PORT:-3005}
      SLA_SERVICE_PORT: ${SLA_SERVICE_PORT:-3006}
      ESCALATION_SERVICE_PORT: ${ESCALATION_SERVICE_PORT:-3007}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-3008}
      AUDIT_SERVICE_PORT: ${AUDIT_SERVICE_PORT:-3009}
      REPORTING_SERVICE_PORT: ${REPORTING_SERVICE_PORT:-3010}
      INTEGRATION_SERVICE_PORT: ${INTEGRATION_SERVICE_PORT:-3011}
      API_DOCS_PORT: ${API_DOCS_PORT:-3003}
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    extra_hosts:
      # Linux: permite ao nginx acessar os serviços rodando no host (pnpm run dev)
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
