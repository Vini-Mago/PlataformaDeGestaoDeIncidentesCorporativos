groups:
  - name: pgic-core
    rules:
      - alert: PgicServiceDown
        expr: up{job="pgic-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PGIC target down: {{ $labels.instance }}"
          description: "Prometheus cannot scrape target {{ $labels.instance }} for 2 minutes."

      - alert: PgicHighHttp5xxRate
        expr: sum by (service) (rate(pgic_http_requests_total{status_class="5xx"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate in {{ $labels.service }}"
          description: "{{ $labels.service }} is returning more than 0.05 5xx responses per second over 5 minutes."

      - alert: PgicHighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(pgic_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency in {{ $labels.service }}"
          description: "{{ $labels.service }} p95 HTTP latency is above 1s for 10 minutes."

      - alert: PgicRabbitMqQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog: {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has more than 1000 ready messages for 5 minutes."
